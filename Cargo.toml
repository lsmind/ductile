[package]
name = "ductile"
version = "0.23.0"
edition = "2021"
authors = ["lsmind"]
description = "A declarative pipeline DSL with e-graph multi-path selection"
license = "MIT"
repository = "https://github.com/lsmind/ductile"
keywords = ["pipeline", "dsl", "egraph", "workflow"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ductile"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ductile"
path = "src/bin/main.rs"

[features]
mlv-failpoint = []

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["fast", "std", "zeroize"] }
getrandom = "0.4.3"

[profile.release]
opt-level = 3
lto = true
