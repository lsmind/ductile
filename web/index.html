<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ductile · 控制台</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #0f1526;
    --panel: #131b30;
    --line: #1e2a47;
    --text: #d8e1f3;
    --dim: #7c8db0;
    --blue: #4f8ff7;
    --gold: #e8b04b;
    --green: #4ade80;
    --red: #f87171;
    --mono: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse 80% 50% at 70% -10%, #16213e 0%, var(--bg) 60%);
    color: var(--text);
    font: 14px/1.6 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: baseline; gap: 16px;
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  header h1 em { color: var(--gold); font-style: normal; }
  header .sub { color: var(--dim); font-size: 13px; }
  #stats { margin-left: auto; display: flex; gap: 18px; }
  #stats .s { text-align: right; }
  #stats .n { font: 600 20px/1.2 var(--mono); color: var(--blue); }
  #stats .l { font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  main {
    display: grid; grid-template-columns: 420px 1fr; gap: 24px;
    padding: 24px 40px 60px; max-width: 1400px; margin: 0 auto;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 24px;
  }
  .panel h2 {
    font-size: 12px; font-weight: 600; color: var(--gold);
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  input {
    width: 100%; background: var(--bg2); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); padding: 8px 10px;
    font: 13px var(--mono); outline: none;
  }
  input:focus { border-color: var(--blue); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    margin-top: 16px; width: 100%; padding: 10px;
    background: linear-gradient(135deg, var(--blue) 0%, #3563c9 100%);
    border: none; border-radius: 6px; color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { filter: grayscale(.6); cursor: wait; }
  button.ghost {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font-weight: 400; font-size: 12px; padding: 5px 10px; width: auto; margin: 0;
  }
  button.ghost:hover { border-color: var(--blue); color: var(--text); filter: none; }
  pre {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px; font: 12px/1.5 var(--mono);
    overflow: auto; max-height: 340px; white-space: pre-wrap; word-break: break-all;
  }
  .ok-badge { color: var(--green); } .err-badge { color: var(--red); }
  .tag {
    display: inline-block; padding: 1px 8px; margin: 2px 3px 2px 0;
    background: #1a2542; border: 1px solid var(--line); border-radius: 10px;
    font: 11px var(--mono); color: var(--blue);
  }
  .tag.gold { color: var(--gold); }
  .card {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px; background: var(--bg2);
  }
  .card .head { display: flex; align-items: baseline; gap: 10px; }
  .card .name { font: 600 14px var(--mono); color: var(--text); }
  .card .lang { font: 11px var(--mono); color: var(--dim); }
  .card .flags { margin-left: auto; display: flex; gap: 6px; }
  .flag { font: 10px var(--mono); padding: 1px 6px; border-radius: 8px; }
  .flag.pure { color: var(--green); border: 1px solid #1d3a2b; }
  .flag.side { color: var(--red); border: 1px solid #3a1d1d; }
  .flag.safe { color: var(--blue); border: 1px solid #1d2f4a; }
  .flag.excl { color: var(--gold); border: 1px solid #3a2f1d; }
  .card .desc { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .card .args { margin-top: 8px; }
  .argrow { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .argrow input { flex: 1; }
  .runbtn { margin: 0; width: auto; padding: 6px 14px; font-size: 12px; }
  .proc {
    border-left: 2px solid var(--blue); padding: 8px 12px; margin-bottom: 8px;
    background: var(--bg2); border-radius: 0 6px 6px 0;
  }
  .proc .pname { font: 600 13px var(--mono); }
  .proc .pdesc { color: var(--dim); font-size: 12px; }
  .impl { font: 12px var(--mono); color: var(--dim); padding: 2px 0 2px 14px; }
  .impl b { color: var(--text); font-weight: 500; }
  .group { display: inline-flex; gap: 4px; align-items: center; margin: 3px 6px 3px 0; }
  .group .gname { font: 11px var(--mono); color: var(--gold); }
  .gnode { font: 11px var(--mono); padding: 1px 7px; border-radius: 8px; background: #1a2542; color: var(--blue); }
  table { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid #141d33; }
  .st-Ok { color: var(--green); } .st-Err, .st-Fail { color: var(--red); }
  .dim { color: var(--dim); }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>ductile <em>·铸渠</em></h1>
  <span class="sub">声明式流水线控制台</span>
  <div id="stats">
    <div class="s"><div class="n" id="st-pipelines">–</div><div class="l">PIPELINES</div></div>
    <div class="s"><div class="n" id="st-procs">–</div><div class="l">PROCS</div></div>
    <div class="s"><div class="n" id="st-runs">–</div><div class="l">RUNS</div></div>
    <div class="s"><div class="n" id="st-comp">–</div><div class="l">COMPOSITIONS</div></div>
  </div>
</header>
<main>
  <div>
    <div class="panel">
      <h2>执行流水线</h2>
      <label>pipeline 文件路径</label>
      <input id="run-path" placeholder="/home/you/pipelines/xxx.pipeline" value="">
      <div class="row2">
        <div><label>topic</label><input id="run-topic" placeholder="{topic}"></div>
        <div><label>policy (.eval)</label><input id="run-policy" placeholder="可选"></div>
      </div>
      <label>params（k=v，逗号分隔）</label>
      <input id="run-params" placeholder="mode=fast, n=3">
      <button id="btn-run">运 行</button>
      <pre id="run-out" class="dim">// 结果将显示在这里</pre>
    </div>
    <div class="panel">
      <h2>最近执行</h2>
      <label>proc 名</label>
      <div class="argrow"><input id="runs-proc" placeholder="gen"><button class="ghost runbtn" id="btn-runs">查询</button></div>
      <div style="max-height:300px;overflow:auto"><table id="runs-table">
        <thead><tr><th>proc</th><th>impl</th><th>状态</th><th>ms</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <h2>流水线结构</h2>
      <div class="argrow">
        <input id="pipe-path" placeholder="同左侧路径，回车加载">
        <button class="ghost runbtn" id="btn-pipe">解析</button>
      </div>
      <div id="pipe-out" style="margin-top:12px"><span class="dim">解析后显示 procs / impls / 并行组 / 关键路径</span></div>
    </div>
    <div class="panel">
      <h2>脚本契约 <span style="color:var(--dim);letter-spacing:0;text-transform:none;font-weight:400">（脚本即 API · 可直接调用）</span></h2>
      <div id="scripts"></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function jget(url) { const r = await fetch(url); return r.json(); }
async function jpost(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  return r.json();
}

function loadStats() {
  jget('/api/stats').then(s => {
    $('st-pipelines').textContent = s.pipelines;
    $('st-procs').textContent = s.procs;
    $('st-runs').textContent = s.runs;
    $('st-comp').textContent = s.compositions;
  });
}

function loadScripts() {
  jget('/api/scripts').then(cards => {
    $('scripts').innerHTML = cards.map(c => `
      <div class="card">
        <div class="head">
          <span class="name">${esc(c.name)}</span>
          <span class="lang">${esc(c.lang)}</span>
          <div class="flags">
            ${c.pure ? '<span class="flag pure">PURE</span>' : '<span class="flag side">SIDE-EFFECTS</span>'}
            <span class="flag ${c.concurrency === 'safe' ? 'safe' : 'excl'}">${esc(c.concurrency).toUpperCase()}</span>
            ${c.cse_safe ? '<span class="flag safe">CSE-SAFE</span>' : ''}
          </div>
        </div>
        <div class="desc">${esc(c.desc)}</div>
        <div class="args">${(c.params||[]).map(p => `
          <div class="argrow">
            <span class="tag">${esc(p.name)}:${esc(p.type)}${p.required ? '*' : ''}</span>
            <input data-script="${esc(c.name)}" data-param="${esc(p.name)}" placeholder="${p.default !== null && p.default !== undefined ? '默认 ' + esc(p.default) : '值'}">
          </div>`).join('')}
          <div class="argrow"><button class="ghost runbtn" onclick="callScript('${esc(c.name)}', this)">调用</button>
          <span class="script-out dim" style="font:11px var(--mono)"></span></div>
        </div>
      </div>`).join('') || '<span class="dim">无已注册脚本 — ductile script attach &lt;file&gt;</span>';
  });
}

async function callScript(name, btn) {
  const card = btn.closest('.args');
  const args = {};
  card.querySelectorAll('input[data-script]').forEach(i => {
    if (i.value.trim()) args[i.dataset.param] = i.value.trim();
  });
  const out = card.querySelector('.script-out');
  out.textContent = '…'; out.className = 'script-out';
  const r = await jpost('/api/script_call', {name, args});
  if (r.ok) {
    out.innerHTML = '<span class="ok-badge">✓</span> ' + esc(JSON.stringify(r.fields || r.result));
    loadStats();
  } else {
    out.innerHTML = '<span class="err-badge">✗</span> ' + esc(r.error);
  }
}

$('btn-run').onclick = async () => {
  const btn = $('btn-run');
  btn.disabled = true; btn.textContent = '执行中 …';
  const out = $('run-out');
  out.textContent = '// engine running…';
  const params = {};
  $('run-params').value.split(',').forEach(p => {
    const [k, v] = p.split('=');
    if (k && k.trim()) params[k.trim()] = (v || '').trim();
  });
  const body = {path: $('run-path').value.trim(), topic: $('run-topic').value, params};
  if ($('run-policy').value.trim()) body.policy = $('run-policy').value.trim();
  try {
    const r = await jpost('/api/run', body);
    out.textContent = JSON.stringify(r, null, 2);
    out.className = r.ok ? 'ok-badge' : 'err-badge';
    loadStats();
    if ($('pipe-path').value.trim() === body.path) loadPipe();
  } catch (e) {
    out.textContent = 'request failed: ' + e; out.className = 'err-badge';
  }
  btn.disabled = false; btn.textContent = '运 行';
};

async function loadRuns() {
  const proc = $('runs-proc').value.trim();
  const rows = await jget('/api/runs?proc=' + encodeURIComponent(proc) + '&limit=15');
  $('runs-table').querySelector('tbody').innerHTML = rows.map(r =>
    `<tr><td>${esc(r.proc)}</td><td>${esc(r.impl)}</td>
     <td class="st-${esc(r.status)}">${esc(r.status)}</td>
     <td>${r.latency_ms}</td></tr>`).join('')
    || '<tr><td colspan="4" class="dim">无记录</td></tr>';
}

async function loadPipe() {
  const path = $('pipe-path').value.trim();
  if (!path) return;
  const el = $('pipe-out');
  try {
    const p = await jget('/api/pipeline?path=' + encodeURIComponent(path));
    if (p.error) { el.innerHTML = `<span class="err-badge">${esc(p.error)}</span>`; return; }
    el.innerHTML = `
      <div>${p.procs.map(pr => `
        <div class="proc">
          <div class="pname">${esc(pr.name)}${pr.deliver ? ' <span class="tag gold">deliver</span>' : ''}</div>
          ${pr.impls.map(im => `<div class="impl"><b>${esc(im.name)}</b> → ${esc(im.refs.length ? '@' + im.refs.join(', @') : '')}
            ${im.when ? `<span class="tag gold">when ${esc(im.when)}</span>` : ''}
            ${im.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>`).join('')}
        </div>`).join('')}</div>
      <div style="margin-top:12px">
        <span class="dim">并行组：</span>
        ${p.parallel_groups.map((g, i) => `<span class="group"><span class="gname">G${i + 1}</span>${g.map(n => `<span class="gnode">${esc(n)}</span>`).join('')}</span>`).join('')}
      </div>
      <div style="margin-top:8px"><span class="dim">关键路径：</span>
        ${p.critical_path.map(n => `<span class="gnode">${esc(n)}</span>`).join(' <span class="dim">→</span> ')}</div>`;
  } catch (e) {
    el.innerHTML = `<span class="err-badge">${esc(e)}</span>`;
  }
}

$('btn-runs').onclick = loadRuns;
$('btn-pipe').onclick = loadPipe;
$('pipe-path').addEventListener('keydown', e => { if (e.key === 'Enter') loadPipe(); });
$('run-path').addEventListener('change', () => { $('pipe-path').value = $('run-path').value; loadPipe(); });

loadStats(); loadScripts();
</script>
</body>
</html>
