[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

# NOTE: PyPI "ductile" is OUR package (0.4.1-0.6.1 published 2026-08, maturin
# build). Keep version in sync with Cargo.toml on every release; publish via
# maturin build --release -o dist + twine (token: ~/.config/ductile/pypi-token.sh).
[project]
name = "ductile"
version = "0.19.0"
description = "A declarative pipeline DSL with e-graph multi-path selection"
license = "MIT"
requires-python = ">=3.8"
keywords = ["pipeline", "dsl", "egraph", "workflow"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
ductile = "ductile:cli_main"

[tool.maturin]
python-source = "python"
module-name = "ductile._ductile"
